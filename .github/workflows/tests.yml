# Lint and test the three packages on every push and pull request, against the fake
# NIS-Elements (nis_bridge.fake). Hardware tests are left out by their markers; model
# evaluations need API keys and stay a manual step.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen   # the chat window's tests, without a screen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries for PySide6
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the three packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "./1_nis_bridge[test]" -e "./2_nis_engine[test]" -e "./3_nis_assistant[test]"
          pip install "ruff==0.15.0"   # pinned: a newer ruff changes its rules and formatting

      - name: Lint and format
        run: |
          for package in 1_nis_bridge 2_nis_engine 3_nis_assistant; do
            (cd "$package" && ruff check . && ruff format --check .)
          done

      - name: Tests
        run: |
          pytest 1_nis_bridge -q
          pytest 2_nis_engine -q
          pytest 3_nis_assistant -q
